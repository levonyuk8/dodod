<div class="main">
  <div class="left">
    @defer {
      <app-three-wardrobe></app-three-wardrobe>
    }
  </div>

  <div class="right">
    <div class="preview-container panel">
      @defer {
        <app-stepper (restart)="startAgain()" [step]="currentStep()"></app-stepper>
      }
    </div>

    <div class="settings-container">
      @switch (currentStep()) {
        @case (Steps.one) {
          @defer {
            <app-step-1></app-step-1>
          }
        }
        @case (Steps.two) {
          @defer {
            <ng-container *ngTemplateOutlet="s2"></ng-container>
          }
        }
        @case (Steps.three) {
          @defer {
            <app-step-3 (isCompleteFillingEv)="handleCompleteFilling($event)"></app-step-3>
          }
        }
        @case (Steps.four) {
          @defer {
            <app-step-4></app-step-4>
          }
        }
        @case (Steps.five) {
          @defer {
            <app-step-5></app-step-5>
          }
        }
      }
    </div>

    <div class="action-btn-container mb-8">
      <app-button [disabled]="currentStep() === Steps.one" [width]="'200'" (click)="prevStep()" [variant]="'bg-transparent'">
        Предыдущий шаг
      </app-button>
      <app-button [disabled]="currentStep() === Steps.five" [width]="'200'" (click)="nextStep()" [variant]="'primary'">
        Следующий шаг
      </app-button>
    </div>
  </div>
</div>

<ng-template #s2>
  <app-step-2></app-step-2>
</ng-template>
